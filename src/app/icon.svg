<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="JobPaper">
  <!--
    The Takeoff Sheet, reduced to a favicon: ruled line items with quantities
    on the left, and the total ruled off in safety blue at the foot. Site
    white on steel — the sheet on the clipboard, not a fintech card.
  -->
  <rect width="32" height="32" rx="3" fill="#20242A"/>
  <rect x="6" y="4" width="20" height="24" rx="1.5" fill="#F7F7F5"/>
  <!-- the quantity column rule -->
  <path d="M11.5 7v14" stroke="#20242A" stroke-opacity="0.22" stroke-width="1.2"/>
  <!-- line items -->
  <g stroke="#20242A" stroke-opacity="0.42" stroke-width="1.6" stroke-linecap="round">
    <path d="M8.5 9h1.5M13.5 9h10"/>
    <path d="M8.5 13h1.5M13.5 13h8"/>
    <path d="M8.5 17h1.5M13.5 17h10"/>
  </g>
  <!-- the running total, ruled off -->
  <path d="M9 21.5h14" stroke="#155EA8" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M14 24.5h9" stroke="#155EA8" stroke-width="2.6" stroke-linecap="round"/>
</svg>
